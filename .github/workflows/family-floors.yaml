# Runs the test suite against the hvtiR family versions DESCRIPTION declares as
# floors, not against their mains (#566).
#
# Every other job installs the family from main, so a floor that admits a
# release this package cannot run against stays green. #562 was such a case:
# its templates used arguments new on the family mains while the floors still
# admitted releases that reject them, and only a reviewer running the
# installed releases saw it.
#
# The job installs dependencies as R-CMD-check does, then replaces each family
# member with its floor (.github/scripts/install-family-floors.R) and runs the
# tests with NOT_CRAN=true, failing on any skip as well as any failure
# (.github/scripts/test-family-floors.R). test-templates.R already asserts
# that DESCRIPTION's floors are at least what the templates' own
# packageVersion() guards demand, so this job also runs that check at the
# floors.
#
# No path filter: a floor can break with no change here, when a template comes
# to rely on something only a newer member has, and this context may become a
# required check, which a path filter would leave waiting. One Linux leg is
# enough, because the question is which family versions, not which platform.
name: family-floors

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One in-flight run per workflow per ref; protected branches are exempt, as
  # in the other workflows.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !github.ref_protected }}

jobs:
  family-floors:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # local::. installs this package, because the Quarto render tests run
      # the installed copy. It comes from this checkout and is not a family
      # member, so the floors below leave it alone.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::remotes
            any::pkgload
            local::.
          needs: check

      - name: Install the family at its declared floors
        run: Rscript .github/scripts/install-family-floors.R

      - name: Test against the floors
        run: Rscript .github/scripts/test-family-floors.R
