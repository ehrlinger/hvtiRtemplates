# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:

name: lint.yaml

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # Runs before the R toolchain: needs nothing but the checkout, and a
      # committed internal hostname should fail fast rather than after a
      # full dependency install.
      - name: No site identifiers in tracked files
        run: tools/check-no-site-identifiers.sh

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::lintr
            local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true

  # Catches generated documentation drifting from its roxygen sources, on the
  # PR rather than after the merge. Regenerates and then *fails on the diff*.
  #
  # pull_request only. It is seconds, and does not build the manual.
  docs-current:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # roxygen2 is pinned because it stamps its own version into
          # DESCRIPTION (Config/roxygen2/version), so an unpinned upgrade
          # fails this check on a version bump rather than a doc change.
          # This is the only job in the repo that installs roxygen2 -- keep
          # it that way, so the pin has exactly one place to be wrong.
          extra-packages: |
            any::roxygen2@8.1.0
            local::.
          # roxygenise() only needs this package's Imports loadable, and it
          # has none. "hard" keeps the job from queueing behind Suggests it
          # will never load.
          dependencies: '"hard"'

      - name: Documentation is current
        run: |
          Rscript -e 'roxygen2::roxygenise()'
          git diff --exit-code man/ NAMESPACE DESCRIPTION
