# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          # `true` opts in Linux and Windows only. `always` includes macOS,
          # avoiding CRAN's Zstandard-compressed R 4.6 ARM binaries, which
          # stable pak currently rejects as an unknown archive type.
          use-public-rspm: always
          rtools-version: '44'

      # Posit macOS binaries such as gdtools link against libXrender under
      # /opt/X11. GitHub's macOS runner does not include that runtime.
      - name: Install XQuartz on macOS
        if: runner.os == 'macOS'
        run: brew install --cask xquartz

      # DESCRIPTION carries real dependencies -- hvtiRutilities via Remotes:
      # plus stats under Imports -- and jsonlite, quarto, and testthat under
      # Suggests. setup-r-dependencies detects the .qmd files and installs the
      # Quarto CLI automatically (install-quarto: auto).
      # any::pkgload is for the roadmap-guard step below: test_local() loads
      # the package from source through pkgload rather than through
      # R CMD check, which is a separate code path with its own dependency.
      # local::. is for the Windows leg. legacy-study-migration.qmd calls
      # library(hvtiRtemplates), and on Windows the R process Quarto starts
      # during R CMD build does not find the temporary library R CMD build
      # installed the package into, although R_LIBS names it. Upstream is
      # quarto-dev/quarto-r#217, still open, and installing the package from
      # the checkout is the workaround given there. On the other legs the
      # temporary library comes first, so the vignette builds as before.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::pkgload
            local::.
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'

