# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          rtools-version: '44'

      # DESCRIPTION carries real dependencies -- hvtiRutilities via Remotes:
      # plus stats under Imports -- and jsonlite and testthat under Suggests.
      # There are no vignettes to build, so Quarto setup does not apply here.
      # any::pkgload is for the roadmap-guard step below: test_local() loads
      # the package from source through pkgload rather than through
      # R CMD check, which is a separate code path with its own dependency.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::pkgload
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'

      # The job catalog test-roadmap.R reads no longer lives in this repo -- it
      # moved to the sibling package hvtiR, at inst/extdata/jobs.json. This
      # checkout puts a copy where HVTI_JOBS can point at it, pinned to a tag
      # rather than hvtiR's main so that editing the catalog in that repo
      # cannot fail every pull request here. Only the one matrix leg that runs
      # the strict guard below needs it, so it is scoped to the same
      # condition; that also keeps the added checkout off the Windows and
      # macOS legs, where the `run:` step's bash syntax would need `shell:
      # bash` to work at all.
      - uses: actions/checkout@v4
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        with:
          repository: ehrlinger/hvtiR
          ref: v1.1.3
          path: .hvtiR

      - name: Point HVTI_JOBS at the checked-out catalog
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: echo "HVTI_JOBS=$GITHUB_WORKSPACE/.hvtiR/inst/extdata/jobs.json" >> "$GITHUB_ENV"
        shell: bash

      # The job catalog lives under dev/-adjacent tooling only via HVTI_JOBS or
      # a sibling checkout, neither of which the tarball the check-r-package
      # step above builds has -- so test-roadmap.R skips its three tests there
      # on purpose. This step is the only place those tests actually run: it
      # loads the package from the checked-out SOURCE tree, where HVTI_JOBS
      # now points at the sibling catalog above. One matrix leg is enough --
      # this checks repository content, not platform behaviour.
      # HVTI_ROADMAP_STRICT turns a skip into a hard failure, so a broken path
      # resolution can't pass silently as "0 tests ran, all green".
      - name: Run the roadmap vocabulary guard against the source tree
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        env:
          HVTI_ROADMAP_STRICT: 1
        run: testthat::test_local(".", filter = "roadmap", stop_on_failure = TRUE)
        shell: Rscript {0}
