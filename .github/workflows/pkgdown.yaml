# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
  # No `release:` trigger, deliberately. A release here tags a commit that is
  # already on main, and the push that merged it has already built and deployed
  # it. A release-triggered run can only repeat that deploy or, when main has
  # moved on, overwrite the site with an older commit: hvtiRlifetables v0.1.3
  # (tagged at f024064) did that on 2026-09-11 and rolled the live help pages
  # back past the ehrlinger/hvtiRlifetables#20 fix. The site documents main.
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

concurrency:
  # One in-flight run per workflow per ref. Without this every push starts a
  # fresh run while the superseded one keeps holding a runner, and the queue
  # grows faster than it drains -- one run sat queued for 410 minutes on
  # 2026-08-17 behind work that had already been replaced. Protected branches
  # are exempt, so a release run is never cancelled mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !github.ref_protected }}

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The template gallery's rendered reports (about 25 MB) live on the
      # `gallery` release, not in git: dev/gallery/publish.sh uploads them, and
      # pkgdown copies pkgdown/assets/ to the site root. A missing archive
      # leaves the site without its gallery and says so, rather than failing
      # the whole site.
      - name: Fetch the template gallery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release download gallery --pattern gallery.tar.gz --dir "$RUNNER_TEMP"; then
            mkdir -p pkgdown/assets
            tar -xzf "$RUNNER_TEMP/gallery.tar.gz" -C pkgdown/assets
            echo "Template gallery: $(ls pkgdown/assets/gallery/reports/*.html | wc -l) reports."
          else
            echo "::warning::No gallery.tar.gz on the 'gallery' release; the site builds without its template gallery."
          fi

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
