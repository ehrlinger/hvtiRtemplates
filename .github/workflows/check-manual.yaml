# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# Runs R CMD check --as-cran WITHOUT --no-manual, so the PDF manual is
# actually built. That step is what catches raw Unicode in .Rd files
# (Greek letters, combining marks) that --no-manual skips in silence.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: check-manual.yaml

permissions: read-all

jobs:
  check-manual:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/setup-tinytex@v2

      # error-on "warning" rather than "note": this package is not on CRAN,
      # so --as-cran reports a permanent "New submission" NOTE that is not a
      # defect and must not redden the build.
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          error-on: '"warning"'
