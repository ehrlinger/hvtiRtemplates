# Fails when prose or a diagram disagrees with the generated map it copies from.
#
# Two checks, one job: they share a trigger, a runner and a rationale, so a
# second workflow would only duplicate all three.
#
# The map is authoritative and the spec's tables are a convenience copy. That
# copy drifted three times on 2026-08-14 -- each time a count was hand-synced in
# one place and not another, and each time a reviewer caught it rather than CI.
# This makes the agreement mechanical.
#
# It does NOT re-run the scan. Regenerating the map needs ~/Documents/macro.library
# and ~/Documents/template, which are outside version control and absent on a
# runner. That step stays local; this is what CI can honestly enforce.
# ---------------------------------------------------------------------------
# The two path filters below and the two `run:` paths must be changed together
# and in the same commit as any move of dev/specs/. Getting that wrong does not
# fail the check -- the trigger simply stops matching, the job never starts, and
# the PR goes green with nothing having been verified. A red check is loud; a
# check that silently stopped existing is not.
#
# `inst/templates/**` is in both filters for check-roadmap-counts.py's disk
# check specifically -- it reads that tree to catch a template landing or
# disappearing without a matching ledger row. Removing the filter does not fail
# that check either; it just stops the job from starting on the one kind of PR
# the check exists to cover, which is the same silent-drift failure mode as
# above, aimed at this guard's main case.
#
# check-spec-counts.py finds its target through os.pardir, so artifacts/ has to
# stay a direct child of the directory holding the design documents. Promoting
# it to a sibling repoints it one level too high.
# ---------------------------------------------------------------------------
name: spec-counts

on:
  push:
    branches: [main]
    paths:
      - 'dev/specs/**'
      - 'inst/templates/**'
      - '.github/workflows/spec-counts.yaml'
  pull_request:
    paths:
      - 'dev/specs/**'
      - 'inst/templates/**'
      - '.github/workflows/spec-counts.yaml'

permissions: read-all

jobs:
  spec-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Spec prose agrees with the generated map
        run: python3 dev/specs/artifacts/check-spec-counts.py

      - name: Job flow diagrams agree with the generated maps
        run: python3 dev/specs/artifacts/check-flow-counts.py

      - name: Roadmap ledger agrees with the templates on disk
        run: python3 dev/specs/artifacts/check-roadmap-counts.py
