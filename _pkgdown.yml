url: https://ehrlinger.github.io/hvtiRtemplates/
template:
  bootstrap: 5
  bslib:
    bootswatch: zephyr
    base_font:
      google: Outfit
    code_font:
      google: Fira Code
  light-switch: yes
  theme: atom-one-light
  theme-dark: atom-one-dark

# The template gallery is a static site under pkgdown/assets/gallery/, copied
# to the site root by pkgdown and rebuilt by hand (dev/gallery/). The navbar
# links it beside the articles, as hvtiPlotR links its recipes book.
navbar:
  structure:
    right: [gallery, search, github, lightswitch]
  components:
    gallery:
      text: Template gallery
      href: gallery/index.html
      aria-label: Every template, what it is for, how to add it, and the report it produces

# Deliberately no `reference:` section. pkgdown then indexes every exported
# object automatically, so the index cannot drift out of step with NAMESPACE.
# A hand-maintained index aborts the build the moment an export is added
# without a matching entry, which is a failure mode this package does not
# need for four functions.

articles:
  - title: Tutorials
    contents:
      - new-study
      - study-setup
      - sas-to-r-descriptive
      - legacy-study-migration
  - title: Reference
    contents:
      - template-catalog

footer:
  structure:
    left: developed_by
    right: built_with_pkgdown
  components:
    developed_by: John Ehrlinger
    built_with_pkgdown: This site was built using [pkgdown](https://pkgdown.r-lib.org/)!&nbsp;&nbsp;<img
      src='https://pkgdown.r-lib.org/logo.png' alt='pkgdown logo' width='25'>
